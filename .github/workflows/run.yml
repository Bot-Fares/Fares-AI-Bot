name: Run Fares Bot
on:
  workflow_dispatch: # بيخليك تشغل البوت يدوي بضغطة زرار

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Start Bot
        run: node index.js
